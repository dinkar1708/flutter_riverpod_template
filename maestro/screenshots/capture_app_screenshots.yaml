# Captures app screenshots for README documentation.
# Run: maestro test maestro/screenshots/capture_app_screenshots.yaml
appId: com.example.flutter_rivperpod_template.dev
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Continue as Guest"
    timeout: 15000
- takeScreenshot:
    path: docs/screenshots/01_login

- tapOn: "Continue as Guest"
- extendedWaitUntil:
    visible:
      id: "home_welcome_card"
    timeout: 15000
- takeScreenshot:
    path: docs/screenshots/02_home

- tapOn:
    id: "home_feature_api_integration"
- extendedWaitUntil:
    visible: "Repositories (dinkar1708)"
    timeout: 30000
- takeScreenshot:
    path: docs/screenshots/03_repositories
- back
- runFlow: ../subflows/return_to_home_dashboard.yaml

- tapOn:
    id: "home_feature_search_filter"
- extendedWaitUntil:
    visible: "Search Users"
    timeout: 10000
- takeScreenshot:
    path: docs/screenshots/04_search_users
- back
- runFlow: ../subflows/return_to_home_dashboard.yaml

- tapOn:
    id: "home_feature_state_management"
- extendedWaitUntil:
    visible:
      id: "counter_hint"
    timeout: 10000
- takeScreenshot:
    path: docs/screenshots/05_counter
- back
- runFlow: ../subflows/return_to_home_dashboard.yaml

- tapOn:
    id: "home_feature_auto_route_navigation"
- extendedWaitUntil:
    visible: "NavigationChild1Route"
    timeout: 10000
- takeScreenshot:
    path: docs/screenshots/06_navigation
- back
- runFlow: ../subflows/return_to_home_dashboard.yaml

- tapOn:
    point: "50%, 94%"
- extendedWaitUntil:
    visible:
      id: "explore_discover_header"
    timeout: 10000
- takeScreenshot:
    path: docs/screenshots/07_explore

- tapOn:
    point: "83%, 94%"
- extendedWaitUntil:
    visible:
      id: "profile_account_header"
    timeout: 10000
- takeScreenshot:
    path: docs/screenshots/08_profile

- tapOn:
    id: "profile_settings_menu"
- extendedWaitUntil:
    visible:
      id: "settings_appearance_header"
    timeout: 10000
- takeScreenshot:
    path: docs/screenshots/09_settings
