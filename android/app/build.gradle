plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def loadEnvProperties(String envFileName) {
    def envProps = new Properties()
    def envFile = rootProject.file("../${envFileName}")
    if (envFile.exists()) {
        envFile.withReader('UTF-8') { reader ->
            envProps.load(reader)
        }
    }
    return envProps
}

def devEnv = loadEnvProperties(".env.dev")
def prodEnv = loadEnvProperties(".env.prod")

println("🗺️ [Gradle Build] Loaded Dev Google Maps Key: ${devEnv.getProperty('GOOGLE_MAPS_API_KEY', '')} (For debug and testing only)")
println("🗺️ [Gradle Build] Loaded Prod Google Maps Key: ${prodEnv.getProperty('GOOGLE_MAPS_API_KEY', '')} (For debug and testing only)")


android {
    namespace "com.example.flutter_rivperpod_template"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.example.flutter_rivperpod_template"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Manifest placeholders
        manifestPlaceholders += [
            applicationName: "android.app.Application",
            mapsApiKey: devEnv.getProperty('GOOGLE_MAPS_API_KEY', '')
        ]
    }
    flavorDimensions "default"
    productFlavors {
        dev {
            resValue 'string', 'app_name', 'DevRiverpodTemplate'
            applicationIdSuffix ".dev"
            manifestPlaceholders += [
                mapsApiKey: devEnv.getProperty('GOOGLE_MAPS_API_KEY', '')
            ]
        }
        prod {
            resValue 'string', 'app_name', 'RiverpodTemplate'
            manifestPlaceholders += [
                mapsApiKey: prodEnv.getProperty('GOOGLE_MAPS_API_KEY', '')
            ]
        }
    }

    buildTypes {
        release {
            // Enable code shrinking, obfuscation, and optimization
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
