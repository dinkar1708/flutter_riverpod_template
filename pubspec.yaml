name: flutter_riverpod_template
description: "A new Flutter river pod project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  freezed_annotation: ^3.1.0
  retrofit: ^4.0.1
  dio: ^5.10.0
  json_annotation: ^4.11.0
  flutter_hooks: ^0.21.3+1
  auto_route: ^11.1.0
  hooks_riverpod: ^3.3.1
  riverpod: ^3.2.1
  webview_flutter: ^4.14.1
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1
  # Security
  flutter_secure_storage: ^10.3.1
  envied: ^1.3.8
  # Testing
  mockito: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit_generator: ^10.2.6
  riverpod_generator: ^4.0.3
  # used with freezed model
  json_serializable: ^6.13.0
  auto_route_generator: ^10.4.0
  build_runner: ^2.4.14
  freezed: ^3.2.5
  envied_generator: ^1.3.8

flutter:
  uses-material-design: true
